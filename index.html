<!DOCTYPE html>
<html lang="ru">

<head>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-sidepanel.css">
  <link rel="stylesheet" href="style-button.css">
  <link rel="stylesheet" href="style-footer.css">
  <link rel="stylesheet" href="style-modal.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Интернет-магазин косметики. Маски, кремы, гели и муссы для бережного ухода за кожей">
  <meta property="og:title" content="Лучший интернет-магазин косметики">
  <meta property="og:description" content="Ухаживайте за своей кожей вместе с нами">
  <meta property="og:image" content="images/photo_1.png">
  <!-- указать реальный адрес картинки,которую хотим показать в карточке сайте в предпросмотре сайта -->
  <meta property="og:url" content="index.html"> <!-- указать реальный адрес старницы -->
  <title>Интернет-магазин косметики</title>
</head>

<body>
  <div id="left-sidepanel" class="sidepanel">
    <button id="change-bgs-card-btn" class="button">Сменить цвет всех карточек</button>
    <button id="change-bg-card-btn" class="button">Сменить цвет карточки</button>
    <button id="open-google" class="button">открыть Google</button>
    <button id="btn-change-color" class="button--active button">Кнопка смены цвета</button>
    <button id="output-console-log" class="button">Вывести сообщение в консоль лог</button>
  </div>
  <div class="container">
    <h1 class="container__title">Выбери свой продукт</h1>
    <ul class="products-list">
      <!-- Карточки генерируем через JS -->
    </ul>

    <template id="product-card-template">
      <li class="product-card">
        <img class="product-card__img" src="" alt="" width="290" height="245" />
        <div class="product-card__list">
          <span class="product-card__label"></span>
          <h2 class="product-card__title"></h2>
          <p class="product-card__description"></p>
        </div>
        <span class="product-card__compound">Состав: </span>
        <ul class="product-card__component-list"></ul>
        <div class="product-card__price-block">
          <div class="product-card__price price">
            <b>Цена</b>
            <span class="price__value"></span>
          </div>
          <button class="product-card__button button">
            <img src="images/botton_add.png" width="16" height="16" alt="+">
            <span class="button__text">Купить</span>
          </button>
        </div>
      </li>
    </template>

  </div>

  <!-- Подвал сайта -->
  <footer class="footer">
    <div class="footer__container">
      <div class="footer__container-main">
        <div class="footer__brand-wrapper"> <!-- Левая часть -->
          <p class="footer__brand">Product Cards</p>
          <p class="footer__slogan">У Нас Самые Лучшие Продукты Для Кожи!</p>
          <div class="footer__ico">
            <img class="footer__ico-tg" src="ico/telegram.png" alt="наш tg">
            <img class="footer__ico-vk" src="ico/vk.png" alt="наш vk">
          </div>
        </div>

        <div class="footer__form-wrapper">
          <form class="footer__form" id="subscribe-form"> <!-- Центральная часть -->
            <p class="footer__offer">Подпишись на наши акции:</p>
            <div class="footer__input-container">
              <input class="footer__input" placeholder="Введи Email..." name="email" type="email" required>
              <button class="footer__button" type="submit">Подписаться</button>
            </div>
          </form>
        </div>

        <div class="footer__menu-wrapper">
          <nav class="footer__menu"> <!-- Правая часть -->
            <p class="footer__menu-title">Быстрые ссылки</p>
            <ul class="footer__menu-list">
              <li class="footer__menu-item"><a href="">Главная</a></li>
              <li class="footer__menu-item"><a href="">Магазин</a></li>
              <li class="footer__menu-item"><a href="">Контакты</a></li>
              <li class="footer__menu-item"><a href="" id="modal__btn-open">Регистрация</a></li>
            </ul>
          </nav>
        </div>
      </div>
      <p class="footer__copyright">www.product-cards.com © all right reserve</p>
    </div>
  </footer>

  <!-- Модальное окно -->
  <div id="modal" class="modal overlay">
    <div class="modal-content">
      <span id="close-modal" class="close-button">&times;</span>
      <h2>Регистрация</h2>
      <form class="modal__form" id="register-form">
        <div class="modal__input-container">
          <label class="modal__label">
            <span class="modal__label-text">Имя</span>
            <input class="modal__input" placeholder="Введите имя..." name="name" type="text" required autofocus>
          </label>
          <label class="modal__label">
            <span class="modal__label-text">Фамилия</span>
            <input class="modal__input" placeholder="Введите фамилию..." name="lastName" type="text" required>
          </label>
          <label class="modal__label">
            <span class="modal__label-text">Отчество</span>
            <input class="modal__input" placeholder="Введите отчество..." name="surname" type="text">
          </label>
          <label class="modal__label">
            <span class="modal__label-text">Дата рождения</span>
            <input class="modal__input" placeholder="Введите дату рождения..." name="birthDate" type="date" required>
          </label>
          <label class="modal__label">
            <span class="modal__label-text">Логин</span>
            <input class="modal__input" placeholder="Введите логин..." name="login" type="text" required minlength="4">
          </label>
          <label class="modal__label">
            <span class="modal__label-text">Пароль</span>
            <input class="modal__input" id="password" placeholder="Введите пароль..." name="password" type="password" required
              minlength="4">
          </label>
          <label class="modal__label">
            <span class="modal__label-text">Повторите пароль</span>
            <input class="modal__input" id="passwordRepeat" placeholder="Введите повторение пароля..." name="passwordRepeat" type="password"
              required>
          </label>
          <label class="modal__label">
            <span class="modal__label-text">Email</span>
            <input class="modal__input" placeholder="Введите Email..." name="email" type="email" required>
          </label>
          <button class="modal__button" id="modal__btn-reg" type="submit">Зарегистрироваться</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="script-sidepanel.js"> </script>
  <script src="script.js"> </script>
  <script src="homework-7.js"> </script>
  <script src="homework-8.js"> </script>
  <script type="module" src="homework-9.js"> </script>
  <script type="module" src="homework-10.js"> </script>
  <script type="module" src="homework-11.js"> </script>
  <!-- <script src="test-scripts.js"> </script> -->

</body>

</html>
